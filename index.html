<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f5f">
  <title>Game Summaries</title>
  <style>
    :root {
      --ink: #173f5f;
      --muted: #5f7482;
      --paper: #fffdf8;
      --cream: #f3eee3;
      --coral: #ee7651;
      --line: #d9dedb;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: var(--cream);
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    .app-shell {
      display: grid;
      grid-template-columns: minmax(220px, 280px) minmax(0, 760px);
      gap: clamp(1rem, 4vw, 4rem);
      width: min(1120px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(1rem, 4vw, 3rem);
    }

    aside { padding-top: 0.5rem; }

    .eyebrow {
      margin: 0 0 0.4rem;
      color: var(--coral);
      font: 700 0.75rem/1.2 system-ui, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 0.95;
    }

    .intro { margin: 0 0 1.75rem; color: var(--muted); line-height: 1.5; }

    nav { display: grid; gap: 0.35rem; }

    nav a {
      display: block;
      padding: 0.7rem 0.8rem;
      border-left: 3px solid transparent;
      color: var(--ink);
      font: 600 0.98rem system-ui, sans-serif;
      text-decoration: none;
    }

    nav a:hover, nav a[aria-current="page"] {
      border-left-color: var(--coral);
      background: rgba(255, 253, 248, 0.7);
    }

    main {
      min-width: 0;
      padding: clamp(1.25rem, 4vw, 3.5rem);
      background: var(--paper);
      box-shadow: 0 12px 36px rgba(23, 63, 95, 0.08);
    }

    #status { color: var(--muted); font: 0.9rem system-ui, sans-serif; }

    .markdown-body { font-size: clamp(1.05rem, 1.5vw, 1.2rem); line-height: 1.65; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 { line-height: 1.15; }
    .markdown-body h1 { margin-top: 0; font-size: clamp(2.1rem, 5vw, 3.8rem); }
    .markdown-body h2 { margin-top: 2.2rem; font-size: clamp(1.5rem, 3vw, 2rem); }
    .markdown-body h3 { margin-top: 1.7rem; font-size: 1.3rem; }
    .markdown-body ul, .markdown-body ol { padding-left: 1.35rem; }
    .markdown-body li + li { margin-top: 0.35rem; }
    .markdown-body strong { color: #b45136; }
    .markdown-body blockquote { margin-left: 0; padding-left: 1rem; border-left: 4px solid var(--coral); color: var(--muted); }
    .markdown-body code { padding: 0.12rem 0.3rem; background: #edf0ed; font-size: 0.9em; }
    .markdown-body a { color: #b45136; }

    @media (max-width: 700px) {
      .app-shell { display: block; padding: 1rem; }
      aside { padding: 0.5rem 0 1rem; }
      .intro { margin-bottom: 1rem; }
      nav { display: flex; gap: 0.35rem; overflow-x: auto; padding-bottom: 0.4rem; }
      nav a { flex: 0 0 auto; border: 1px solid var(--line); padding: 0.55rem 0.7rem; font-size: 0.88rem; }
      nav a:hover, nav a[aria-current="page"] { border-color: var(--coral); }
      main { padding: 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside>
      <p class="eyebrow">Quick reference</p>
      <h1>Game Summaries</h1>
      <p class="intro">Rules at a glance, ready for the table.</p>
      <nav id="game-list" aria-label="Game summaries"></nav>
    </aside>
    <main>
      <p id="status">Loading summary...</p>
      <article id="content" class="markdown-body"></article>
    </main>
  </div>

  <script src="scripts/marked.min.js"></script>
  <script src="scripts/purify.min.js"></script>
  <script>
    const games = [
      "games/Camel Up.md",
      "games/Cockroach Poker.md",
      "games/High Society.md",
      "games/Skull.md",
      "games/Ticket To Ride First Journey.md",
      "games/Whitehall Mystery.md"
    ];
    const list = document.querySelector("#game-list");
    const content = document.querySelector("#content");
    const status = document.querySelector("#status");

    function titleFor(fileName) {
      return fileName.replace(/^games\//, "").replace(/\.md$/, "");
    }

    function renderNavigation(selectedFile) {
      list.innerHTML = games.map((fileName) => {
        const selected = fileName === selectedFile ? ' aria-current="page"' : "";
        return `<a href="#${encodeURIComponent(fileName)}"${selected}>${titleFor(fileName)}</a>`;
      }).join("");
    }

    async function loadGame() {
      const selectedFile = decodeURIComponent(location.hash.slice(1)) || games[0];
      const fileName = games.includes(selectedFile) ? selectedFile : games[0];
      renderNavigation(fileName);
      status.textContent = `Loading ${titleFor(fileName)}...`;
      content.innerHTML = "";

      try {
        const response = await fetch(encodeURI(fileName));
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const markdown = await response.text();
        content.innerHTML = DOMPurify.sanitize(marked.parse(markdown));
        status.textContent = "";
        document.title = `${titleFor(fileName)} | Game Summaries`;
      } catch (error) {
        status.textContent = `Could not load ${titleFor(fileName)}.`;
        content.innerHTML = "<p>Check that this folder is being served by a web server.</p>";
        console.error(error);
      }
    }

    window.addEventListener("hashchange", loadGame);
    loadGame();
  </script>
</body>
</html>
