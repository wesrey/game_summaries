<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#323643">
  <title>Game Summaries</title>
  <style>
    :root {
      --charcoal: #323643;
      --muted: #606470;
      --paper: #f7f7f7;
      --fog: #f7f7f7;
      --sky: #93deff;
      --azure: #1f77a8;
      --line: #d9dedb;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--charcoal);
      background: var(--fog);
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    .app-shell {
      display: grid;
      grid-template-columns: minmax(220px, 280px) minmax(0, 760px);
      gap: clamp(1rem, 4vw, 4rem);
      width: min(1120px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(1rem, 4vw, 3rem);
    }

    aside { padding-top: 0.5rem; }

    .eyebrow {
      margin: 0 0 0.4rem;
      color: var(--azure);
      font: 700 0.75rem/1.2 system-ui, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 0.95;
    }

    .intro { margin: 0 0 1.75rem; color: var(--muted); line-height: 1.5; }

    nav { display: grid; gap: 0.35rem; }

    nav a {
      display: block;
      padding: 0.7rem 0.8rem;
      border-left: 3px solid transparent;
      color: var(--charcoal);
      font: 600 0.98rem system-ui, sans-serif;
      text-decoration: none;
    }

    nav a:hover, nav a[aria-current="page"] {
      border-left-color: var(--azure);
      background: rgba(255, 253, 248, 0.7);
    }

    .nav-toggle {
      display: none;
      border: none;
      background: none;
      cursor: pointer;
      padding: 0;
    }

    main {
      min-width: 0;
      padding: clamp(1.25rem, 4vw, 3.5rem);
      background: var(--paper);
      box-shadow: 0 12px 36px rgba(23, 63, 95, 0.08);
    }

    #status { color: var(--muted); font: 0.9rem system-ui, sans-serif; }

    .markdown-body { font-size: clamp(1.05rem, 1.5vw, 1.2rem); line-height: 1.65; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 { line-height: 1.15; }
    .markdown-body h1 { margin-top: 0; font-size: clamp(2.1rem, 5vw, 3.8rem); }
    .markdown-body h2 { margin-top: 2.2rem; font-size: clamp(1.5rem, 3vw, 2rem); }
    .markdown-body h3 { margin-top: 1.7rem; font-size: 1.3rem; }
    .markdown-body ul, .markdown-body ol { padding-left: 1.35rem; }
    .markdown-body li + li { margin-top: 0.35rem; }
    .markdown-body strong { color: var(--azure); }
    .markdown-body blockquote { margin-left: 0; padding-left: 1rem; border-left: 4px solid var(--sky); color: var(--muted); }
    .markdown-body code { padding: 0.12rem 0.3rem; background: #edf0ed; font-size: 0.9em; }
    .markdown-body a { color: var(--azure); }

    @media (max-width: 700px) {
      .app-shell { display: block; padding: 1rem; }
      aside { padding: 3rem 0 1rem; }
      .intro { margin-bottom: 1rem; }

      .nav-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        position: fixed;
        top: 0.75rem;
        left: 0.75rem;
        z-index: 20;
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 6px;
        background: var(--paper);
        color: var(--charcoal);
        font-size: 1.3rem;
        box-shadow: 0 4px 12px rgba(23, 63, 95, 0.15);
      }

      nav { display: none; }
      nav.nav-open {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        position: fixed;
        inset: 0;
        z-index: 15;
        background: var(--paper);
        padding: 4.5rem 1rem 1.5rem;
        overflow-y: auto;
      }
      nav.nav-open a { flex: none; border: 1px solid var(--line); padding: 0.9rem 1rem; font-size: 1rem; }
      nav.nav-open a:hover, nav.nav-open a[aria-current="page"] { border-color: var(--sky); }
      main { padding: 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside>
      <button id="nav-toggle" class="nav-toggle" type="button" aria-label="Toggle game list" aria-expanded="false" aria-controls="game-list">☰</button>
      <p class="eyebrow">Quick reference</p>
      <h1>Game Summaries</h1>
      <p class="intro">Rules at a glance, ready for the table.</p>
      <nav id="game-list" aria-label="Game summaries"></nav>
    </aside>
    <main>
      <p id="status">Loading summary...</p>
      <article id="content" class="markdown-body"></article>
    </main>
  </div>

  <script src="scripts/marked.min.js"></script>
  <script src="scripts/purify.min.js"></script>
  <script>
    let games = [];
    const list = document.querySelector("#game-list");
    const content = document.querySelector("#content");
    const status = document.querySelector("#status");
    const navToggle = document.querySelector("#nav-toggle");

    function closeNav() {
      list.classList.remove("nav-open");
      navToggle.setAttribute("aria-expanded", "false");
      navToggle.textContent = "☰";
    }

    navToggle.addEventListener("click", () => {
      const isOpen = list.classList.toggle("nav-open");
      navToggle.setAttribute("aria-expanded", String(isOpen));
      navToggle.textContent = isOpen ? "✕" : "☰";
    });

    list.addEventListener("click", (event) => {
      if (event.target.closest("a")) closeNav();
    });

    function titleFor(fileName) {
      return fileName.replace(/^games\//, "").replace(/\.md$/, "");
    }

    function renderNavigation(selectedFile) {
      list.innerHTML = games.map((fileName) => {
        const selected = fileName === selectedFile ? ' aria-current="page"' : "";
        return `<a href="#${encodeURIComponent(fileName)}"${selected}>${titleFor(fileName)}</a>`;
      }).join("");
    }

    async function loadGame() {
      const selectedFile = decodeURIComponent(location.hash.slice(1)) || games[0];
      const fileName = games.includes(selectedFile) ? selectedFile : games[0];
      renderNavigation(fileName);
      status.textContent = `Loading ${titleFor(fileName)}...`;
      content.innerHTML = "";

      try {
        const response = await fetch(encodeURI(fileName));
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const markdown = await response.text();
        content.innerHTML = DOMPurify.sanitize(marked.parse(markdown));
        status.textContent = "";
        document.title = `${titleFor(fileName)} | Game Summaries`;
      } catch (error) {
        status.textContent = `Could not load ${titleFor(fileName)}.`;
        content.innerHTML = "<p>Check that this folder is being served by a web server.</p>";
        console.error(error);
      }
    }

    async function loadGameCatalog() {
      try {
        const response = await fetch("games/games-list.json");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        games = (await response.json()).map((fileName) => `games/${fileName}`);
        if (!games.length) throw new Error("The game catalog is empty");
        window.addEventListener("hashchange", loadGame);
        loadGame();
      } catch (error) {
        status.textContent = "Could not load the game catalog.";
        content.innerHTML = "<p>Check that games/games-list.json is available.</p>";
        console.error(error);
      }
    }

    loadGameCatalog();
  </script>
</body>
</html>
